name: CI/CD to Local Registry

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore FMS.sln

    - name: Build Solution
      run: dotnet build FMS.sln --no-restore --configuration Release
      
    - name: Run Tests & Collect Coverage
      run: |
        dotnet test FMS.sln \
          --no-build \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --logger "trx;LogFileName=test-results.trx"

    - name: Publish Test Results
      uses: enricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: '**/test-results.trx'
    
    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate HTML Coverage Report
      run: |
        reportgenerator \
          -reports:"**/coverage.cobertura.xml" \
          -targetdir:"coveragereport" \
          -reporttypes:Html

    - name: Upload HTML Report Artifact
      uses: actions/upload-artifact@v4
      with:
        path: coveragereport/

    - name: Add Report Link to Summary
      run: |
        echo "### Code Coverage HTML Report" >> $GITHUB_STEP_SUMMARY
        echo "[View Latest Coverage Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY

  deploy-pages:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  call-shared-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: doradora58/SharedWorkflows/.github/workflows/deploy.yml@main
    with:
      service-name: "fms"
      host-port: "8080"
    secrets:
      registry-host: ${{ secrets.REGISTRY_HOST }}
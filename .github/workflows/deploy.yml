name: CI/CD to Local Registry

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore FMS.sln

    - name: Build Solution
      run: dotnet build FMS.sln --no-restore --configuration Release

    - name: Run Tests & Collect Coverage
      run: |
        dotnet test FMS.sln \
          --no-build \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --logger "trx;LogFileName=test-results.trx"

    - name: Publish Test Results
      uses: enricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: '**/test-results.trx'

    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: '**/coverage.cobertura.xml'
        badge: true
        fail_below_min: false
        format: markdown
        hide_complexity: true
        indicators: true
        output: both

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-and-coverage-reports
        path: |
          **/test-results.trx
          **/coverage.cobertura.xml

  call-shared-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: doradora58/SharedWorkflows/.github/workflows/deploy.yml@main
    with:
      service-name: "fms"
      host-port: "8080"
    secrets:
      registry-host: ${{ secrets.REGISTRY_HOST }}
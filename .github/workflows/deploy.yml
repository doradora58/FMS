name: CI/CD to Local Registry

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore FMS.sln

    - name: Build Solution
      run: dotnet build FMS.sln --no-restore --configuration Release

    - name: Run Tests & Collect Coverage
      run: |
        dotnet test FMS.sln \
          --no-build \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --logger "trx;LogFileName=test-results.trx"

    - name: Upload Test Results & Coverage Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-and-coverage-reports
        path: |
          **/test-results.trx
          **/coverage.cobertura.xml

  call-shared-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: doradora58/SharedWorkflows/.github/workflows/deploy.yml@main
    with:
      service-name: "fms"
      host-port: "8080"
    secrets:
      registry-host: ${{ secrets.REGISTRY_HOST }}
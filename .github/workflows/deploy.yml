name: CI/CD to Local Registry

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore FMS.sln

    - name: Build Solution
      run: dotnet build FMS.sln --no-restore --configuration Release

    - name: Run Tests & Collect Coverage
      run: dotnet test FMS.sln --no-build --configuration Release --collect:"XPlat Code Coverage"

    - name: Upload Coverage Results
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: '**/coverage.cobertura.xml'

  call-shared-deploy:
    uses: doradora58/SharedWorkflows/.github/workflows/deploy.yml@main
    with:
      service-name: "fms"
      host-port: "8080"
    secrets:
      registry-host: ${{ secrets.REGISTRY_HOST }}
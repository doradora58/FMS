name: CI/CD to Local Registry

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore FMS.sln

    - name: Build Solution
      run: dotnet build FMS.sln --no-restore --configuration Release
      
    - name: Run Tests & Collect Coverage
      run: |
        dotnet test FMS.sln \
          --no-build \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --logger "trx;LogFileName=test-results.trx"

    - name: Publish Test Results
      uses: enricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: '**/test-results.trx'
    
    - name: Generate Coverage Summary
      if: always()
      run: |
        python3 - << 'EOF'
        import xml.etree.ElementTree as ET
        import glob, os

        files = glob.glob('**/coverage.cobertura.xml', recursive=True)
        if files:
            tree = ET.parse(files[0])
            root = tree.getroot()
            line_rate = float(root.attrib.get('line-rate', 0)) * 100
            branch_rate = float(root.attrib.get('branch-rate', 0)) * 100

            summary_md = "### 📊 Code Coverage Summary\n" \
                       + "| Metric | Coverage Rate |\n" \
                       + "| :--- | :--- |\n" \
                       + f"| **Line Coverage** | **{line_rate:.2f}%** |\n" \
                       + f"| **Branch Coverage** | **{branch_rate:.2f}%** |\n"

            with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                f.write(summary_md)
            print('Coverage summary successfully added to Step Summary.')
        else:
            print('Warning: coverage.cobertura.xml not found.')
        EOF

  call-shared-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: doradora58/SharedWorkflows/.github/workflows/deploy.yml@main
    with:
      service-name: "fms"
      host-port: "8080"
    secrets:
      registry-host: ${{ secrets.REGISTRY_HOST }}